name: Build and release Lume Code

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'src/**'
      - 'tests/**'
      - 'third-party/ast-grep/**'
      - 'npm/**'
      - 'scripts/**'
      - '.github/workflows/native-release.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'src/**'
      - 'tests/**'
      - 'third-party/ast-grep/**'
      - 'npm/**'
      - 'scripts/**'
      - '.github/workflows/native-release.yml'
  workflow_dispatch:

concurrency:
  # Give every commit its own run so a version-bump release is not
  # silently superseded by a later ordinary push to main.
  group: lume-code-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Test and build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            runner: windows-latest
          - target: darwin-arm64
            runner: macos-latest
          - target: darwin-x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check package versions
        shell: bash
        run: |
          cargo_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          npm_version=$(node -p "require('./npm/package.json').version")
          lock_version=$(sed -n '/^name = "lume-code"$/{n;s/^version = "\([^"]*\)"/\1/p;}' Cargo.lock | head -n 1)
          test -n "$cargo_version" && test "$cargo_version" = "$npm_version" && test "$cargo_version" = "$lock_version" || { echo "Cargo.toml, Cargo.lock, and npm/package.json versions must match."; exit 1; }
      - name: Run Rust and npm tests
        run: |
          cargo test --locked
          npm test --prefix npm
      - name: Build native binaries
        shell: bash
        run: |
          cargo build --release --locked
          cargo build --release --locked --manifest-path third-party/ast-grep/Cargo.toml -p ast-grep
          mkdir -p "npm/native/${{ matrix.target }}"
          if [[ "${{ matrix.target }}" == "win32-x64" ]]; then
            cp target/release/lume-code.exe third-party/ast-grep/target/release/ast-grep.exe "npm/native/${{ matrix.target }}/"
          else
            cp target/release/lume-code third-party/ast-grep/target/release/ast-grep "npm/native/${{ matrix.target }}/"
            chmod +x "npm/native/${{ matrix.target }}/"*
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: npm/native/${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 14
      - name: Report platform build result
        if: success()
        shell: bash
        run: 'echo "${{ matrix.target }}: tests passed and native binaries were uploaded." >> "$GITHUB_STEP_SUMMARY"'

  release-eligibility:
    name: Check release version gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        name: Release only when all package versions change together
        shell: bash
        run: |
          set -euo pipefail
          current_cargo=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          current_npm=$(node -p "require('./npm/package.json').version")
          current_lock=$(sed -n '/^name = "lume-code"$/{n;s/^version = "\([^"]*\)"/\1/p;}' Cargo.lock | head -n 1)
          if [[ -z "$current_cargo" || "$current_cargo" != "$current_npm" || "$current_cargo" != "$current_lock" ]]; then
            echo "Cargo.toml, Cargo.lock, and npm/package.json must contain the same version." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          previous="${{ github.event.before }}"
          if [[ "$previous" =~ ^0+$ ]] || ! git cat-file -e "$previous^{commit}" 2>/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Initial branch push: building only." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          previous_cargo=$(git show "$previous:Cargo.toml" 2>/dev/null | sed -n 's/^version = "\([^"]*\)"/\1/p' | head -n 1 || true)
          previous_npm=$(git show "$previous:npm/package.json" 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).version||'')}catch{console.log('')}})" || true)
          previous_lock=$(git show "$previous:Cargo.lock" 2>/dev/null | sed -n '/^name = "lume-code"$/{n;s/^version = "\([^"]*\)"/\1/p;}' | head -n 1 || true)
          if [[ "$current_cargo" == "$previous_cargo" && "$current_npm" == "$previous_npm" && "$current_lock" == "$previous_lock" ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No package version bump: validation and platform builds ran; no release was published." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$current_cargo" == "$previous_cargo" || "$current_npm" == "$previous_npm" || "$current_lock" == "$previous_lock" ]]; then
            echo "Cargo.toml, Cargo.lock, and npm/package.json versions must all be bumped in the same commit." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if ! [[ "$current_cargo" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be a stable semantic version in major.minor.patch format." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$current_cargo" >> "$GITHUB_OUTPUT"
          echo "Version bump detected: releasing lume-code@$current_cargo after all platform builds succeed." >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish npm package and GitHub release
    needs: [build, release-eligibility]
    if: needs.release-eligibility.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.5.1
      - name: Remove token auth so npm can use OIDC
        shell: bash
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [[ -f "$npmrc" ]]; then
            sed -i '/_authToken/d; /^always-auth=/d' "$npmrc"
          fi
      - uses: actions/download-artifact@v4
        with:
          name: native-win32-x64
          path: npm/native/win32-x64
      - uses: actions/download-artifact@v4
        with:
          name: native-darwin-arm64
          path: npm/native/darwin-arm64
      - uses: actions/download-artifact@v4
        with:
          name: native-darwin-x64
          path: npm/native/darwin-x64
      - name: Verify packaged binaries and dry-run npm tarball
        working-directory: npm
        env:
          LUME_SKIP_NATIVE_BUILD: '1'
        run: |
          chmod +x native/darwin-arm64/lume-code native/darwin-arm64/ast-grep native/darwin-x64/lume-code native/darwin-x64/ast-grep
          npm pack --dry-run
      - name: Publish package if this version is not already present
        working-directory: npm
        env:
          VERSION: ${{ needs.release-eligibility.outputs.version }}
        run: |
          if npm view "lume-code@$VERSION" version >/dev/null 2>&1; then
            echo "lume-code@$VERSION is already present; skipping duplicate publication and continuing release recovery." >> "$GITHUB_STEP_SUMMARY"
          else
            npm publish --access public --provenance
          fi
          npm view "lume-code@$VERSION" version
      - name: Create or refresh GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-eligibility.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp npm/native/win32-x64/lume-code.exe release/lume-code-win32-x64.exe
          cp npm/native/win32-x64/ast-grep.exe release/ast-grep-win32-x64.exe
          cp npm/native/darwin-arm64/lume-code release/lume-code-darwin-arm64
          cp npm/native/darwin-arm64/ast-grep release/ast-grep-darwin-arm64
          cp npm/native/darwin-x64/lume-code release/lume-code-darwin-x64
          cp npm/native/darwin-x64/ast-grep release/ast-grep-darwin-x64
          (cd npm && npm pack --ignore-scripts --pack-destination ../release)
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* --title "Lume Code $VERSION" --generate-notes --target "$GITHUB_SHA"
          fi
          gh release view "$tag" --json url,assets --jq '"Release: " + .url + "\nAssets: " + ([.assets[].name] | join(", "))' | tee -a "$GITHUB_STEP_SUMMARY"
